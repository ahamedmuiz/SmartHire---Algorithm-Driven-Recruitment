<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">SmartHire | Freelancer Portal</a>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-8">
            <h3 class="mb-3">Available Jobs</h3>
            <div id="availableJobsList">
            </div>
        </div>

        <div class="col-md-4">
            <h3 class="mb-3">My Applications</h3>
            <div class="card shadow-sm">
                <ul class="list-group list-group-flush" id="myApplicationsList">
                </ul>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="applyJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Apply for <span id="modalJobTitle" class="text-primary">Job</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="applyJobForm">
                    <input type="hidden" id="applyJobId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Upload Resume (PDF format only)</label>
                        <input class="form-control" type="file" id="resumePdf" accept=".pdf" required>
                        <div class="form-text">Our system will automatically extract your skills to calculate a match score.</div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/candidate-app.js"></script>
</body>
</html>
