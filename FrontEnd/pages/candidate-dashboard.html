<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background-color: #0ea5e9; background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%); }
        .feed-card { border: none; border-radius: 12px; margin-bottom: 20px; transition: 0.2s; }
        .feed-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.06); transform: translateY(-3px); }
        .skill-badge { background-color: #e0f2fe; color: #0284c7; font-weight: 500; font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; margin-right: 5px; margin-bottom: 5px; display: inline-block;}
        .app-list-item { border-left: 4px solid #cbd5e1; border-radius: 8px !important; margin-bottom: 10px; border-top: 1px solid rgba(0,0,0,.125) !important; }
        .app-list-item.hired { border-left-color: #10b981; }
        .app-list-item.rejected { border-left-color: #ef4444; }
        .app-list-item.pending { border-left-color: #f59e0b; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5 py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-layers-fill text-warning me-2"></i>SmartHire | Freelancer Portal</a>
        <div>
            <button class="btn btn-light btn-sm px-3 rounded-pill me-2 fw-semibold text-primary" data-bs-toggle="modal" data-bs-target="#profileModal"><i class="bi bi-person-circle me-1"></i>Profile</button>
            <button class="btn btn-outline-light btn-sm px-3 rounded-pill" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-lg-8 pe-lg-4">
            <h3 class="fw-bold text-dark mb-4"><i class="bi bi-search me-2 text-primary"></i>Available Opportunities</h3>
            <div id="availableJobsList"></div>
        </div>

        <div class="col-lg-4 mt-5 mt-lg-0">
            <h4 class="fw-bold text-dark mb-4"><i class="bi bi-clock-history me-2 text-secondary"></i>My Applications</h4>
            <div class="card border-0 bg-transparent">
                <ul class="list-group list-group-flush" id="myApplicationsList"></ul>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="applyJobModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">Apply for <span id="modalJobTitle" class="text-primary">Job</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <div class="alert alert-info border-0 rounded-3 small">
                    <i class="bi bi-robot me-1"></i> Our algorithm will parse your resume and generate a match score instantly.
                </div>
                <form id="applyJobForm">
                    <input type="hidden" id="applyJobId">
                    <div class="mb-4 mt-3">
                        <label class="form-label fw-bold">Upload Resume</label>
                        <input class="form-control form-control-lg bg-light" type="file" id="resumePdf" accept=".pdf" required>
                        <div class="form-text mt-2"><i class="bi bi-file-earmark-pdf text-danger me-1"></i>PDF format only.</div>
                    </div>
                    <button type="submit" id="submitAppBtn" class="btn btn-success w-100 py-2 fw-bold rounded-3 shadow-sm">
                        <i class="bi bi-send-check me-2"></i>Submit Application
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="profileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">My Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form id="profileForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Email (Read Only)</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="profileEmail" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Full Name</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="profileName" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">New Password (Leave blank to keep current)</label>
                        <input type="password" class="form-control bg-light border-0 py-2" id="profilePassword">
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold rounded-3">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/candidate-app.js"></script>
</body>
</html>
