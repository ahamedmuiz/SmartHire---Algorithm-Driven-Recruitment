<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f1f2f6; color: #2f3542;}

        .navbar-custom { background-color: #9c88ff; padding: 15px 0; box-shadow: 0 4px 10px rgba(156, 136, 255, 0.2);}
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important;}
        .btn-logout { background-color: white; color: #9c88ff; font-weight: 700; border-radius: 50px; padding: 6px 20px; border: none;}
        .btn-logout:hover { background-color: #f1f2f6; }

        .search-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .form-control, .form-select { border-radius: 10px; background-color: #f1f2f6; border: 2px solid transparent; font-weight: 600;}
        .form-control:focus, .form-select:focus { background-color: white; border-color: #9c88ff; box-shadow: none;}

        .btn-primary-custom { background-color: #9c88ff; color: white; font-weight: 800; border-radius: 10px; padding: 10px 20px; border: none;}
        .btn-primary-custom:hover { background-color: #8c7ae6; color: white;}

        .feed-card { background: white; border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer; padding: 25px; position: relative;}
        .feed-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        .skill-badge { background-color: #f8a5c2; color: #c44569; font-weight: 800; padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; margin-right: 5px; margin-bottom: 5px; display: inline-block;}
        .applied-badge { position: absolute; top: 15px; right: 15px; background: #2ed573; color: white; padding: 6px 12px; border-radius: 50px; font-weight: 800; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);}

        .activity-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden;}
        .app-list-item { border-bottom: 1px solid #f1f2f6; padding: 20px; }
        .app-list-item:last-child { border-bottom: none; }
        .status-badge { font-weight: 800; padding: 5px 10px; border-radius: 8px; font-size: 0.75rem;}

        .modal-content { border-radius: 20px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.2);}
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-person-workspace me-2"></i>SmartHire Candidate</a>
        <button class="btn btn-logout shadow-sm" id="logoutBtn">Log Out</button>
    </div>
</nav>

<div class="container">
    <div class="search-card mb-5 d-flex gap-3 flex-wrap">
        <input type="text" id="searchInput" class="form-control flex-grow-1" placeholder="Search by Job Title or Skill...">
        <select id="typeFilter" class="form-select" style="max-width: 200px;">
            <option value="">All Job Types</option>
            <option>Full Time</option><option>Part Time</option><option>Contract</option><option>Hybrid</option><option>Remote</option>
        </select>
        <button class="btn btn-primary-custom shadow-sm" onclick="filterJobs()"><i class="bi bi-search"></i> Search</button>
        <button class="btn btn-light shadow-sm fw-bold" style="border-radius: 10px; color: #ff4757;" onclick="clearFilter()"><i class="bi bi-x-circle-fill"></i> Clear</button>
    </div>

    <div class="row g-5">
        <div class="col-lg-8">
            <h4 class="fw-bold mb-4" style="color: #2f3542;">Opportunities For You</h4>
            <div id="availableJobsList">
                <div class="text-center text-muted fw-bold mt-5"><span class="spinner-border spinner-border-sm me-2"></span>Loading Jobs...</div>
            </div>
        </div>
        <div class="col-lg-4">
            <h4 class="fw-bold mb-4" style="color: #2f3542;">Your Activity</h4>
            <div class="activity-card">
                <div id="myApplicationsList">
                    <div class="p-4 text-center text-muted fw-bold">Loading Activity...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="jobDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h3 class="modal-title fw-bold" id="detailTitle" style="color: #2f3542;">Job Title</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <h5 class="fw-bold mb-4" style="color: #9c88ff;" id="detailCompany"></h5>

                <div class="d-flex gap-2 flex-wrap mb-4 bg-light p-3 rounded-3">
                    <span class="badge bg-secondary"><i class="bi bi-geo-alt me-1"></i> <span id="detailLocation"></span></span>
                    <span class="badge bg-secondary"><i class="bi bi-briefcase me-1"></i> <span id="detailType"></span></span>
                    <span class="badge bg-secondary"><i class="bi bi-cash me-1"></i> <span id="detailSalary"></span></span>
                    <span class="badge bg-secondary"><i class="bi bi-person me-1"></i> <span id="detailExp"></span></span>
                </div>

                <h6 class="fw-bold text-dark">Description</h6>
                <p id="detailDesc" class="text-muted fw-semibold mb-4"></p>

                <h6 class="fw-bold text-dark">Responsibilities</h6>
                <p id="detailResp" class="text-muted fw-semibold mb-4"></p>

                <h6 class="fw-bold text-dark">Requirements</h6>
                <p id="detailReqs" class="text-muted fw-semibold mb-4"></p>

                <button id="modalApplyBtn" class="btn btn-primary-custom w-100 py-3 mt-2 shadow-sm" style="font-size: 1.1rem;" onclick="openApplyModal()">
                    Apply for this Job
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="applyJobModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold" style="color: #2f3542;">Upload Resume</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="applyJobForm">
                    <input type="hidden" id="applyJobId">
                    <div class="mb-4">
                        <input class="form-control" type="file" id="resumePdf" accept=".pdf" required>
                    </div>
                    <button type="submit" id="submitAppBtn" class="btn btn-primary-custom w-100">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-bold" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/candidate-app.js"></script>
</body>
</html>
