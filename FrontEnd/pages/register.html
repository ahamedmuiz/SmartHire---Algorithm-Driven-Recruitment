<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same head as login -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(120deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }
        .auth-card {
            background: #ffffff;
            border: none;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            margin: auto;
        }
        .form-control, .form-select { border-radius: 12px; padding: 12px; background-color: #f1f2f6; border: 2px solid transparent; font-weight: 600;}
        .form-control:focus, .form-select:focus { background-color: #ffffff; border-color: #ff6b81; box-shadow: none; }
        .form-label { font-weight: 700; color: #2f3542; }

        .btn-primary-custom {
            background-color: #ff4757;
            color: white;
            font-weight: 800;
            border-radius: 12px;
            padding: 14px;
            border: none;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .btn-primary-custom:hover { background-color: #ff6b81; color: white;}
    </style>
</head>
<body>

<div class="container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-rocket-takeoff-fill text-danger" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2" style="color: #2f3542;">Join SmartHire</h3>
            <p class="text-muted fw-semibold">Let's get you set up!</p>
        </div>

        <div id="alertBox"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="Jane Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="regEmail" placeholder="name@email.com" required>
            </div>
            <div class="row">
                <div class="col-sm-6 mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="regPassword" required>
                </div>
                <div class="col-sm-6 mb-4">
                    <label class="form-label">I am a...</label>
                    <select class="form-select" id="role" required>
                        <option value="ROLE_CANDIDATE">Job Seeker</option>
                        <option value="ROLE_HR">Employer</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="regBtn" class="btn btn-primary-custom w-100 shadow-sm">Create Account</button>
            <div class="text-center mt-4">
                <a href="login.html" class="text-decoration-none fw-bold" style="color: #ff4757;">I already have an account</a>
            </div>
        </form>
    </div>
</div>

<script src="../assets/js/auth.js"></script>
</body>
</html>
