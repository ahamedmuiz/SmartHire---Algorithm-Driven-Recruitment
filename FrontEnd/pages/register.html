<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .auth-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .form-control, .form-select { border-radius: 8px; padding: 12px; background-color: #f8f9fa; border: 1px solid #e9ecef; }
        .form-control:focus, .form-select:focus { box-shadow: none; border-color: #212529; background-color: #fff; }
        .btn-dark { border-radius: 8px; padding: 12px; font-weight: 600; }
    </style>
</head>
<body class="d-flex align-items-center" style="min-height: 100vh; padding: 40px 0;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-rocket-takeoff text-dark" style="font-size: 2.5rem;"></i>
                        <h3 class="fw-bold mt-2">Create an Account</h3>
                        <p class="text-muted small">Join SmartHire to find talent or get hired</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label fw-semibold small">Email address</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label fw-semibold small">Password</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">I am a:</label>
                            <select class="form-select" id="role" required>
                                <option value="ROLE_CANDIDATE">Freelancer (Looking for Jobs)</option>
                                <option value="ROLE_HR">Client (Posting Jobs)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 mb-3 shadow-sm">Complete Registration</button>
                        <div class="text-center mt-3">
                            <small class="text-muted">Already have an account? <a href="login.html" class="text-decoration-none fw-bold text-dark">Login here</a></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/auth.js"></script>
</body>
</html>
