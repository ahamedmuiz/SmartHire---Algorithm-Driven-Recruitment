<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .auth-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      background: white;
    }
    .auth-icon { font-size: 3rem; color: #0d6efd; }
    .form-control { border-radius: 8px; padding: 12px; background-color: #f8f9fa; border: 1px solid #e9ecef; }
    .form-control:focus { box-shadow: none; border-color: #0d6efd; background-color: #fff; }
    .btn-primary { border-radius: 8px; padding: 12px; font-weight: 600; }
  </style>
</head>
<body class="d-flex align-items-center" style="height: 100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card auth-card p-4">
        <div class="card-body">
          <div class="text-center mb-4">
            <i class="bi bi-person-circle auth-icon"></i>
            <h3 class="fw-bold mt-2">Welcome Back</h3>
            <p class="text-muted small">Login to access your SmartHire portal</p>
          </div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold small">Password</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">Login to Portal</button>
            <div class="text-center mt-3">
              <small class="text-muted">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold">Register here</a></small>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/auth.js"></script>
</body>
</html>
