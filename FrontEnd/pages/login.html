<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - SmartHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .auth-card {
      background: #ffffff;
      border: none;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 40px;
      max-width: 450px;
      width: 100%;
      margin: auto;
    }
    .form-control { border-radius: 12px; padding: 14px; background-color: #f1f2f6; border: 2px solid transparent; font-weight: 600;}
    .form-control:focus { background-color: #ffffff; border-color: #70a1ff; box-shadow: none; }
    .form-label { font-weight: 700; color: #2f3542; }

    .btn-primary-custom {
      background-color: #1e90ff;
      color: white;
      font-weight: 800;
      border-radius: 12px;
      padding: 14px;
      border: none;
      font-size: 1.1rem;
      transition: 0.2s;
    }
    .btn-primary-custom:hover { background-color: #3742fa; color: white;}
  </style>
</head>
<body>

<div class="container">
  <div class="auth-card">
    <div class="text-center mb-4">
      <i class="bi bi-emoji-smile-fill text-primary" style="font-size: 3rem;"></i>
      <h3 class="fw-bold mt-2" style="color: #2f3542;">Welcome Back!</h3>
      <p class="text-muted fw-semibold">Sign in to your account</p>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@email.com" required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 shadow-sm">Log In</button>

      <div class="text-center mt-4">
        <a href="register.html" class="text-decoration-none fw-bold" style="color: #1e90ff;">I don't have an account yet</a>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/auth.js"></script>
</body>
</html>
