<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        .navbar-custom { background-color: #1e293b; }
        .job-card {
            border: none; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid #0d6efd;
        }
        .job-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .custom-table { border-collapse: separate; border-spacing: 0 10px; }
        .custom-table tr { background-color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-radius: 8px; }
        .custom-table td, .custom-table th { padding: 15px; border: none; vertical-align: middle; }
        .custom-table th { background-color: transparent; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; }
        .custom-table td:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; font-weight: 600; }
        .custom-table td:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5 py-3 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-layers-fill text-primary me-2"></i>SmartHire | Client Portal</a>
        <button class="btn btn-outline-light btn-sm px-3 rounded-pill" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark"><i class="bi bi-briefcase me-2 text-primary"></i>My Job Postings</h2>
        <button class="btn btn-primary fw-semibold px-4 rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#createJobModal">
            <i class="bi bi-plus-lg me-1"></i> Post New Job
        </button>
    </div>

    <div class="row mb-5" id="jobPostingsList"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 mt-5">
        <h3 class="fw-bold text-dark"><i class="bi bi-bar-chart-fill me-2 text-success"></i>Ranked Applicants</h3>
        <span class="text-muted small">Select a job above to view applicants</span>
    </div>

    <div class="table-responsive">
        <table class="table custom-table">
            <thead>
            <tr>
                <th>Candidate Name</th>
                <th>Applied Job</th>
                <th>Match Score</th>
                <th>Status</th>
                <th class="text-end">Action</th>
            </tr>
            </thead>
            <tbody id="applicantTableBody">
            <tr><td colspan="5" class="text-center text-muted py-4 bg-transparent shadow-none">Waiting for selection...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="createJobModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">Post a New Job</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createJobForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Job Title</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="jobTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Required Skills (Comma separated)</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="jobSkills" placeholder="e.g. Java, Spring Boot, React" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Job Description</label>
                        <textarea class="form-control bg-light border-0 py-2" id="jobDesc" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Publish Job</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editJobModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: 15px;">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">Edit Job Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editJobForm">
                    <input type="hidden" id="editJobId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Job Title</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="editJobTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-muted">Required Skills (Comma separated)</label>
                        <input type="text" class="form-control bg-light border-0 py-2" id="editJobSkills" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small text-muted">Job Description</label>
                        <textarea class="form-control bg-light border-0 py-2" id="editJobDesc" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold rounded-3 text-dark">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/hr-dashboard.js"></script>
</body>
</html>
