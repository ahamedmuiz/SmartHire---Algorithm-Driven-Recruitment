<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">SmartHire | HR Portal</a>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Job Postings</h2>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createJobModal">+ Post New Job</button>
    </div>

    <div class="row mb-5" id="jobPostingsList">
    </div>

    <hr>

    <h3 class="mb-3">Ranked Applicants</h3>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Candidate Name</th>
                    <th>Applied Job</th>
                    <th>Match Score</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="applicantTableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="createJobModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Post a New Job</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createJobForm">
                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" class="form-control" id="jobTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Required Skills (Comma separated)</label>
                        <input type="text" class="form-control" id="jobSkills" placeholder="e.g. Java, Spring Boot, MySQL" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Job Description</label>
                        <textarea class="form-control" id="jobDesc" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Publish Job</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/hr-dashboard.js"></script>
</body>
</html>
