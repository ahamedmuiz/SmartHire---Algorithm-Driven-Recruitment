<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - SmartHire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f1f2f6; color: #2f3542;}

        .navbar-custom { background-color: #1e90ff; padding: 15px 0; box-shadow: 0 4px 10px rgba(30,144,255,0.2);}
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important;}
        .btn-logout { background-color: white; color: #1e90ff; font-weight: 700; border-radius: 50px; padding: 6px 20px; border: none;}
        .btn-logout:hover { background-color: #f1f2f6; }

        .job-card { background: white; border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer; border-bottom: 5px solid #1e90ff;}
        .job-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .stat-badge { background: #f1f2f6; color: #2f3542; font-weight: 800; padding: 6px 12px; border-radius: 10px; font-size: 0.8rem; margin-right: 5px;}

        .table-wrapper { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);}
        .table th { color: #747d8c; font-weight: 800; text-transform: uppercase; font-size: 0.85rem;}
        .table td { vertical-align: middle; font-weight: 600;}

        .badge-APPLIED { background-color: #70a1ff; color: white; padding: 6px 10px; border-radius: 8px;}
        .badge-SCREENING { background-color: #a4b0be; color: white; padding: 6px 10px; border-radius: 8px;}
        .badge-SHORTLISTED { background-color: #eccc68; color: #2f3542; padding: 6px 10px; border-radius: 8px;}
        .badge-HIRED { background-color: #2ed573; color: white; padding: 6px 10px; border-radius: 8px;}
        .badge-REJECTED { background-color: #ff4757; color: white; padding: 6px 10px; border-radius: 8px;}

        .btn-primary-custom { background-color: #1e90ff; color: white; font-weight: 800; border-radius: 12px; padding: 10px 20px; border: none;}
        .btn-primary-custom:hover { background-color: #3742fa; color: white;}

        .form-control, .form-select { border-radius: 10px; background-color: #f1f2f6; border: 2px solid transparent; font-weight: 600;}
        .form-control:focus, .form-select:focus { background-color: white; border-color: #1e90ff; box-shadow: none;}

        .modal-content { border-radius: 20px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.2);}
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-5">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-building-check me-2"></i>SmartHire Employer</a>
        <button class="btn btn-logout shadow-sm" id="logoutBtn">Log Out</button>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold" style="color: #2f3542;">Your Postings</h3>
        <button class="btn btn-primary-custom shadow-sm" data-bs-toggle="modal" data-bs-target="#createJobModal">
            <i class="bi bi-plus-circle-fill me-1"></i> Create Job
        </button>
    </div>

    <div class="row mb-5" id="jobPostingsList"></div>

    <h4 class="fw-bold mb-3" style="color: #2f3542;">Applicant Tracking</h4>
    <div class="table-wrapper">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Candidate</th>
                <th>Match Score</th>
                <th>Status</th>
                <th class="text-end">Manage</th>
            </tr>
            </thead>
            <tbody id="applicantTableBody">
            <tr><td colspan="4" class="text-center text-muted py-4 fw-bold">Select a job above to view applicants.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="createJobModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 pt-4 px-4">
                <h4 class="modal-title fw-bold" style="color: #2f3542;">Post a New Job</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="createJobForm" class="row g-3">
                    <div class="col-md-6"><label class="fw-bold text-muted small">Job Title</label><input type="text" id="jobTitle" class="form-control" required></div>
                    <div class="col-md-6"><label class="fw-bold text-muted small">Company Name</label><input type="text" id="jobCompany" class="form-control" required></div>
                    <div class="col-md-4"><label class="fw-bold text-muted small">Location</label><input type="text" id="jobLoc" class="form-control"></div>
                    <div class="col-md-4">
                        <label class="fw-bold text-muted small">Job Type</label>
                        <select id="jobType" class="form-select">
                            <option>Full Time</option><option>Part Time</option><option>Contract</option><option>Hybrid</option><option>Remote</option>
                        </select>
                    </div>
                    <div class="col-md-4"><label class="fw-bold text-muted small">Experience</label><input type="text" id="jobExp" class="form-control"></div>
                    <div class="col-md-12"><label class="fw-bold text-muted small">Salary Range</label><input type="text" id="jobSal" class="form-control"></div>
                    <div class="col-md-12"><label class="fw-bold text-muted small">Required Skills (Comma separated)</label><input type="text" id="jobSkills" class="form-control" required></div>
                    <div class="col-md-12"><label class="fw-bold text-muted small">Description</label><textarea id="jobDesc" class="form-control" rows="3" required></textarea></div>
                    <div class="col-md-12"><label class="fw-bold text-muted small">Responsibilities</label><textarea id="jobResp" class="form-control" rows="3"></textarea></div>
                    <div class="col-md-12"><label class="fw-bold text-muted small">Benefits</label><textarea id="jobBen" class="form-control" rows="3"></textarea></div>
                    <div class="col-12 mt-4"><button type="submit" id="submitJobBtn" class="btn btn-primary-custom w-100">Publish Job</button></div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-bold" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/hr-dashboard.js"></script>
</body>
</html>
