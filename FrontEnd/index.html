<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire - Algorithm-Driven Recruitment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .hero-section {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 100px 0;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 30px rgba(13, 110, 253, 0.2);
        }
        .navbar { background-color: transparent !important; padding-top: 20px; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
        .btn-custom-light { background: white; color: #0d6efd; font-weight: 600; border-radius: 8px; }
        .btn-custom-light:hover { background: #f8f9fa; transform: translateY(-2px); transition: 0.3s; }
        .feature-icon { font-size: 2.5rem; color: #0d6efd; margin-bottom: 15px; }

</head>
<body>

<div class="hero-section">
    <nav class="navbar navbar-expand-lg navbar-dark position-absolute top-0 w-100">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-layers-fill text-warning me-2"></i>SmartHire</a>
            <div class="d-flex">
                <a href="pages/login.html" class="btn btn-outline-light me-3 fw-semibold border-0">Login</a>
                <a href="pages/register.html" class="btn btn-custom-light px-4">Register</a>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="display-4 fw-bold mb-4">Optimize Your Hiring Process</h1>
                <p class="lead mb-5 text-white-50">SmartHire bridges the gap between talent acquisition and job discovery using an automated parsing & ranking algorithm to drastically reduce time-to-hire.</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="pages/register.html" class="btn btn-warning btn-lg fw-bold px-4 shadow"><i class="bi bi-building me-2"></i>Post a Job (Client)</a>
                    <a href="pages/register.html" class="btn btn-outline-light btn-lg fw-bold px-4"><i class="bi bi-person-workspace me-2"></i>Find Jobs (Freelancer)</a>
